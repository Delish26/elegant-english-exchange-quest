<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange Quest — Lesson 1 MVP</title>
<style>
:root{--ink:#19324a;--paper:#fbf8f0;--blue:#dcebf3;--green:#e7eee4;--gold:#cbb9a8;--coral:#ef9a77;--muted:#5b6c78;--ocean:#b9d7e2;--mist:#f6f8f7}*{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.5 ui-rounded,"Avenir Next",system-ui,sans-serif}.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--paper);padding:28px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:800;color:#5b8195}.passport{font-size:1.6rem}.progress{height:9px;background:#d8e0e1;border-radius:99px;margin:18px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:var(--coral);width:0;transition:.25s}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 20px #19324a12}.checkpoint{background:var(--blue);border-left:7px solid var(--gold);padding:20px;border-radius:0 16px 16px 0}.options{display:grid;gap:10px;margin:20px 0}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid #cbd6d5;border-radius:12px;padding:13px;background:#fff;cursor:pointer}.option:has(input:checked){background:#eef7fa;border-color:#5d9bb4}.option input{margin-top:5px;accent-color:var(--ink)}button{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:11px 18px;font:inherit;cursor:pointer}.secondary{background:#e8eef0;color:var(--ink)}button:disabled{opacity:.4;cursor:not-allowed}.feedback{min-height:28px;margin:12px 0;font-weight:800}.good{color:#3f7540}.bad{color:#9a4e3b}.bonus{margin-top:18px;padding:14px;background:#fff8de;border-radius:12px;font-weight:800}.hidden{display:none}.research textarea,.final textarea{display:block;width:100%;min-height:120px;margin:12px 0;border:2px dashed #9bb1b8;border-radius:12px;padding:12px;font:inherit;background:#fff}.research{margin-top:22px;padding:18px;background:var(--green);border-radius:16px}.small{font-size:.9rem;color:var(--muted)}.mission{position:relative;overflow:hidden;text-align:center;background:linear-gradient(145deg,#f6f8f7,#dcebf3);border:3px solid var(--ocean);padding:28px 20px}.porthole{width:145px;height:145px;margin:0 auto 18px;border-radius:50%;border:14px solid #cbb9a8;box-shadow:inset 0 0 0 5px #5b6c78,0 8px 0 #19324a22;background:#b9d7e2;display:grid;place-items:center;font-size:3rem}.mission h2{font-size:2rem;margin:8px 0}.mission .brand{letter-spacing:.18em;font-weight:900;color:#2a8e9c}.mission .next{margin-top:18px;background:#2a8e9c}
</style></head><body><main class="app"><div class="top"><div><div class="eyebrow">Travel Quest · Lesson 1</div><h1 id="title">Jay’s travel quest</h1></div><div class="passport" aria-label="Passport">🛂</div></div><div class="progress"><i id="bar"></i></div><div id="screen"></div></main><script>
const stages=[
{kind:'q',section:'Meaning match',prompt:'At camp, Jay shares one of his Hong Kong videos with his new group. They ask him questions about his old home, and he often tells his family about that day. Which answer best describes the experience?',type:'single',options:['It put him off.','It was a memorable experience.','He found it fascinating.','It was unfamiliar to him.'],correct:[1],feedback:'Choose the phrase that best describes an experience Jay continues to talk about.'},
{kind:'q',section:'Meaning match',prompt:'Jay reads about a junior archaeology workshop where participants examine objects from the past. He signs up after learning what it involves. Which phrase best describes his response to the workshop?',type:'single',options:['was unfamiliar to him','left a lasting impression on him','was memorable to him','appealed to him'],correct:[3],feedback:'Choose the phrase that expresses Jay’s personal attraction or preference.'},
{kind:'q',section:'Meaning match',prompt:'At an archaeology workshop, Jay examines an object found in New York. He asks how people used it and how experts worked out its age. Which adjective best describes his response?',type:'single',options:['unfamiliar','memorable','appealing','fascinating'],correct:[3],feedback:'Choose the word that expresses curiosity and a desire to find out more.'},
{kind:'q',section:'Checkpoint vocabulary',prompt:'Jay finds a photograph of an old railway platform and notices tracks beside the building. He suggests it may have been a station. Which description best fits his suggestion?',type:'single',options:['The most exciting','The most expensive','The most reasonable or believable','The most unusual'],correct:[2],feedback:'A plausible suggestion is the one that is most reasonable or believable.'},
{kind:'q',section:'Most plausible choices · select two',prompt:'Jay is making a video about places that hold memories for people in his new neighbourhood. He plans to interview older residents. Which TWO places would be most likely to prompt stories about the area?',type:'multi',options:['A neighbourhood library that has served local families for many years','An indoor climbing centre that opened last year','A former factory where many local residents once worked','A skatepark recently built beside the river','A dog park opened in the neighbourhood last summer'],correct:[0,2],feedback:'Both places are likely to bring back shared memories of the neighbourhood.'},
{kind:'q',section:'Most plausible choices · select two',prompt:'Which TWO of the following experiences would appeal to someone who likes adventure?',type:'multi',options:['A museum in his own city','A cabin stay in the Alps','A local football match','An overnight ferry between Greek islands'],correct:[1,3],feedback:'Both selected options offer an adventurous experience.'},
{kind:'q',section:'Most plausible choices · select two',prompt:'Jay wants to make a video about how technology creates things people can see or hear. Which two destinations should he investigate?',type:'multi',options:['Tokyo’s Robot District','A hotel breakfast room','A sound studio in Berlin','A football-shirt shop'],correct:[0,2],feedback:'Both places give Jay a chance to explore how technology creates or shapes images and sound.'},
{kind:'q',section:'Travel quest · checkpoint challenge',prompt:'Jay and his dad finish a New York community 5K together. Months later, Jay can still describe crossing the finish line side by side. Which TWO descriptions fit his experience?',type:'multi',options:['He wanted to find out how the race was organised.','He could picture the moment clearly long afterwards.','Taking part was completely new to him.','He still tells people the story of finishing with his dad.'],correct:[1,3],feedback:'Both descriptions show that the experience stayed with Jay in different ways.'},
{kind:'q',section:'Choose the best phrase',prompt:'Jay had watched winter-sports videos for years, but he had never been snowshoeing. On his first trip, the snow and cold were new to him. Which phrase best describes that part of the experience?',type:'single',options:['appealing to me','fascinating to me','memorable to me','unfamiliar to me'],correct:[3],feedback:'The experience was new to Jay: unfamiliar to him.'},
{kind:'q',section:'Choose the best phrase',prompt:'While filming in New York, Jay notices that some streets do not follow the city’s newer grid. A local historian explains the older layout, and Jay starts comparing it with historic maps. Which adjective best captures his response to the explanation?',type:'single',options:['unfamiliar','appealing','fascinating','memorable'],correct:[2],feedback:'Jay is curious and wants to investigate the explanation further: fascinating.'},
{kind:'q',section:'Choose the best phrase',prompt:'Jay reads about a neighbourhood storytelling project in which teens interview residents and share their own experiences of moving. Which phrase best expresses his personal response to the project?',type:'single',options:['be unfamiliar to me','appeal to me','be memorable to me','fascinate me'],correct:[1],feedback:'The project matches Jay’s interests and personal experience, so it would appeal to him.'},
{kind:'q',section:'Choose the best phrase',prompt:'At a neighbourhood street festival, a family welcomes Jay and later becomes close friends. Years later, he still speaks warmly about that evening. Which adjective best describes the experience?',type:'single',options:['fascinating','unfamiliar','appealing','memorable'],correct:[3],feedback:'The experience made a lasting impression on Jay: it was memorable.'},
{kind:'final',title:'Final passport stamp',body:'Mission complete — I look forward to seeing you in the next lesson!',research:false}
];
let index=0;let score=0;const totalQuestions=stages.filter(s=>s.kind==='q').length;const screen=document.getElementById('screen'),bar=document.getElementById('bar');
function render(){const s=stages[index];bar.style.width=`${Math.round(index/(stages.length-1)*100)}%`;if(s.kind==='checkpoint'){screen.innerHTML=`<div class="checkpoint"><div class="eyebrow">Checkpoint</div><h2>${s.title}</h2><p>${s.body}</p>${s.research?'<div class="research"><b>Collection box</b><textarea id="collection" placeholder="1.\n2.\n3."></textarea><p class="small">You may look up information if you do not know what to enter.</p></div>':''}<button id="continue">Unlock next section</button></div>`;document.getElementById('continue').onclick=()=>{index++;render()};return}if(s.kind==='final'){screen.innerHTML=`<div class="card final"><div class="eyebrow">${s.title}</div><h2>${s.body}</h2><textarea id="finalAnswer" placeholder="Type your sentence here…"></textarea><button id="finish">Complete quest</button><div class="feedback" id="finalFeedback"></div></div>`;document.getElementById('finish').onclick=()=>{document.getElementById('finalFeedback').className='feedback good';document.getElementById('finalFeedback').textContent='Quest complete — your response has been recorded.'};return}const input=s.type==='multi'?'checkbox':'radio';screen.innerHTML=`<div class="card"><div class="eyebrow">${s.section} · Question ${index+1}</div><h2>${s.prompt}</h2><div class="options">${s.options.map((o,i)=>`<label class="option"><input type="${input}" name="answer" value="${i}">${o}</label>`).join('')}</div><button id="next" class="secondary">Continue</button></div>`;document.getElementById('next').onclick=()=>{const selected=[...document.querySelectorAll('input:checked')].map(x=>Number(x.value)).sort();const correct=[...s.correct].sort();const ok=selected.length===correct.length&&selected.every((v,i)=>v===correct[i]);if(ok)score++;index++;render()};}
render();
// Elegant English completion-screen override: keeps the original game logic and replaces only the final state.
const originalRender=render;
render=function(){if(stages[index].kind==='final'){bar.style.width='100%';screen.innerHTML=`<div class="card mission"><div class="porthole" aria-hidden="true">EE</div><div class="brand">ELEGANT ENGLISH</div><div class="eyebrow">Final passport stamp</div><h2>Mission complete!</h2><p>I look forward to seeing you in the next lesson!</p></div>`;return}originalRender()};render();
const styleOverride=document.createElement('style');styleOverride.textContent='body{background:#e5e0d7;color:#263746;font-weight:600}.app{background:#f3eee5}.card,.option{background:#faf8f3}.top h1,.card h2,.mission h2{font-weight:850}.option{font-weight:700}.eyebrow{font-weight:850}.feedback{font-weight:800}';document.head.appendChild(styleOverride);
const oldRenderForNumbering=render;render=function(){oldRenderForNumbering();const number=[...stages.slice(0,index+1)].filter(s=>s.kind==='q').length;const label=document.querySelector('.card .eyebrow');if(label&&stages[index].kind==='q')label.textContent=label.textContent.replace(/Question \d+/,'Question '+number)};render();
const renderWithScore=render;render=function(){if(stages[index].kind==='final'){bar.style.width='100%';screen.innerHTML=`<div class="card mission"><div class="porthole" aria-hidden="true">EE</div><div class="brand">ELEGANT ENGLISH</div><div class="eyebrow">Final passport stamp</div><h2>Mission complete!</h2><p class="score">Your score: ${score}/${totalQuestions}</p><p>Thanks for playing. I look forward to seeing you in the next lesson!</p></div>`;return}renderWithScore()};render();
</script></body></html>
